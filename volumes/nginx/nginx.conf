events {
    worker_connections 1024;
}

http {
    large_client_header_buffers 8 32k;
    client_max_body_size 100m;

    upstream kong {
        server kong:8000;
    }

    upstream studio {
        server studio:3000;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS principal ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Studio (Dashboard) ───────────────────────────────────────────────
        # Acesso em /studio/ — protegido por basic auth (opcional).
        # Para habilitar basic auth, descomente as linhas auth_basic e crie
        # o arquivo .htpasswd: htpasswd -c volumes/nginx/.htpasswd admin

        location /studio/_next/ {
            proxy_pass http://studio/_next/;
            proxy_set_header Host $host;
        }

        location /studio/ {
            # auth_basic "Supabase Studio";
            # auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass         http://studio/;
            proxy_redirect     / /studio/;
            proxy_redirect     http:// https://;
            proxy_http_version 1.1;

            proxy_set_header Upgrade         $http_upgrade;
            proxy_set_header Connection      "upgrade";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            proxy_read_timeout 86400;

            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter '"/_next/'  '"/studio/_next/';
            sub_filter "'/_next/"  "'/studio/_next/";
            sub_filter '/_next/'   '/studio/_next/';
        }

        # ── Kong (API Gateway) — rota padrao ─────────────────────────────────
        location / {
            proxy_pass         http://kong;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Deploy Service ────────────────────────────────────────────────────
        location /deploy/ {
            proxy_pass http://deploy-service:9191/deploy/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 200m;
            proxy_read_timeout   300s;
            proxy_send_timeout   300s;
        }
    }
}
