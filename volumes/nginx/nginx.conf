events {
    worker_connections 1024;
}

http {
    large_client_header_buffers 8 32k;
    client_max_body_size 100m;

    upstream kong {
        server kong:8000;
    }

    upstream studio {
        server studio:3000;
    }

    # ── HTTP (local dev) ─────────────────────────────────────────────────────
    # Para producao, habilite o bloco HTTPS e redirecione HTTP → HTTPS.
    server {
        listen 80;
        server_name _;

        # ── Studio (Dashboard) ───────────────────────────────────────────────
        location /studio/_next/ {
            proxy_pass http://studio/_next/;
            proxy_set_header Host $host;
        }

        location /studio/ {
            proxy_pass         http://studio/;
            proxy_redirect     / /studio/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade         $http_upgrade;
            proxy_set_header Connection      "upgrade";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            proxy_read_timeout 86400;

            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter '"/_next/'  '"/studio/_next/';
            sub_filter "'/_next/"  "'/studio/_next/";
            sub_filter '/_next/'   '/studio/_next/';
        }

        # ── Kong (API Gateway) — rota padrao ─────────────────────────────────
        location / {
            proxy_pass         http://kong;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # ── Deploy Service ────────────────────────────────────────────────────
        location /deploy/ {
            proxy_pass http://deploy-service:9191/deploy/;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            client_max_body_size 200m;
            proxy_read_timeout   300s;
            proxy_send_timeout   300s;
        }
    }
}
